name: Feature request
description: Suggest a new component, API, or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Got an idea? We'd love to hear it. Please be as specific as possible. Concrete use cases make it much easier to evaluate and prioritize.

  - type: textarea
    id: motivation
    attributes:
      label: Problem / motivation
      description: What problem does this solve? What are you trying to build that isn't possible or is awkward today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you'd like to see added or changed. Include API sketches, prop names, or examples if you have them.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider? Why didn't they work for your use case?

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this to your project?
      options:
        - Nice to have
        - Important
        - Critical
    validations:
      required: true

  - type: checkboxes
    id: validations
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this hasn't been requested yet
          required: true
        - label: I'm willing to implement this or help with it
